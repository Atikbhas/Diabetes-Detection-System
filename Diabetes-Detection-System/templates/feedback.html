{% extends 'base.html' %}

{% block title %}Submit Feedback — Diabetes Detection System{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-custom p-4 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="p-3 bg-warning bg-opacity-10 text-warning rounded-circle d-inline-block mb-2">
                        <i class="bi bi-chat-heart-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">We Value Your Feedback</h3>
                    <p class="text-muted small">Help us improve the Diabetes Detection System user experience and ML features.</p>
                </div>

                <form action="{{ url_for('feedback') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Your Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" value="{{ current_user.username if current_user.is_authenticated else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" value="{{ current_user.email if current_user.is_authenticated else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold d-block">Overall Rating</label>
                        <div class="star-rating mb-2">
                            <input type="radio" id="star5" name="rating" value="5" checked><label for="star5" title="5 stars"><i class="bi bi-star-fill"></i></label>
                            <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 stars"><i class="bi bi-star-fill"></i></label>
                            <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 stars"><i class="bi bi-star-fill"></i></label>
                            <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 stars"><i class="bi bi-star-fill"></i></label>
                            <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 star"><i class="bi bi-star-fill"></i></label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="message" class="form-label fw-semibold">Your Comments / Suggestions</label>
                        <textarea class="form-control" id="message" name="message" rows="4" placeholder="Tell us what you liked or how we can improve..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold text-dark rounded-pill shadow-sm">
                        <i class="bi bi-send-fill me-2"></i>Submit Feedback
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
